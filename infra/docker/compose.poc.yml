# DEV.ONE Secure Live - Local Docker Compose Baseline (M1/M2 Preparation Only)
#
# PHẠM VI & GIỚI HẠN:
# 1. File Compose này CHỈ dành cho chạy thử cục bộ (local loopback baseline), KHÔNG phải cấu hình production.
# 2. Image được ghim cố định phiên bản `bluenviron/mediamtx:1.21.3` (không dùng `:latest`).
# 3. KHÔNG truyền thông tin xác thực camera qua `environment:` để tránh lộ RTSP URL/mật khẩu
#    khi chạy `docker inspect`. Thay vào đó, mount read-only file cấu hình riêng tư dành cho Docker
#    `../../.local/mediamtx.docker.poc.yml` (mode 0600) đã sinh từ lệnh:
#      python3 scripts/poc.py configure --target docker --source-file .local/camera-source.json
#    Bản `--target docker` lắng nghe `0.0.0.0` bên trong container và mở quyền đọc cho dải bridge cục bộ
#    để Docker port-forward hoạt động từ cổng host `127.0.0.1`, trong khi cổng publish phía host vẫn khóa ở `127.0.0.1`.
# 4. Image chính thức `bluenviron/mediamtx:1.21.3` là minimal image không có `/bin/sh`, `curl` hay `wget`,
#    do đó KHÔNG khai báo `healthcheck` phụ thuộc shell/curl bên trong container. Kiểm tra trạng thái
#    từ máy host qua `http://127.0.0.1:8889/live` hoặc Control API `http://127.0.0.1:9997/v3/paths/list`.
# 5. Giới hạn mạng trên macOS Docker: Docker Desktop chạy trong máy ảo Linux qua lớp NAT, gây ảnh hưởng
#    đến đường RTP/UDP từ camera (RTSP/UDP ingress) cũng như WebRTC ICE UDP candidate. Vì vậy trên macOS,
#    hãy ưu tiên chạy MediaMTX native (`python3 scripts/poc.py run`) khi thử nghiệm A/B TCP vs UDP.
#    Cấu hình Compose này đóng vai trò baseline RTSP-over-TCP và mẫu tham chiếu cho môi trường Linux.

services:
  mediamtx-poc:
    image: bluenviron/mediamtx:1.21.3
    container_name: devone-mediamtx-poc
    restart: "no"
    command: ["/mediamtx.yml"]
    ports:
      - "127.0.0.1:8554:8554/tcp"
      - "127.0.0.1:8889:8889/tcp"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:9997:9997/tcp"
    volumes:
      - type: bind
        source: ../../.local/mediamtx.docker.poc.yml
        target: /mediamtx.yml
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
