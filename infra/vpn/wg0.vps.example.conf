# DEV.ONE Secure Live - WireGuard Server Example Template (Singapore VPS `wg0`)
#
# LƯU Ý BẢO MẬT & VẬN HÀNH:
# - File này CHỈ LÀ MẪU THAM KHẢO (`[VÍ DỤ / EXAMPLE]`), KHÔNG chứa khoá thật và KHÔNG dùng để nạp tự động.
# - Các địa chỉ IP dưới đây (`10.66.0.1/30`, `10.66.0.2/32`, `192.0.2.10/32`) là địa chỉ VÍ DỤ.
# - KHÔNG bao giờ đặt `AllowedIPs = 0.0.0.0/0`. Chỉ định tuyến hẹp tới IP tunnel của ER605 và IP đơn lẻ của camera.

[Interface]
# Địa chỉ tunnel phía Singapore VPS [VÍ DỤ / EXAMPLE]
Address = 10.66.0.1/30
ListenPort = 51820
PrivateKey = <REPLACE_WITH_VPS_WG_PRIVATE_KEY_IN_PRIVATE_FILE>
# Tùy chỉnh MTU sau khi đo thực tế đường WAN/PPPoE tại điểm đặt camera (không đoán mò)
# MTU = 1420

[Peer]
# Peer: Router TP-Link ER605 tại điểm đặt camera [VÍ DỤ / EXAMPLE]
PublicKey = <REPLACE_WITH_ER605_WG_PUBLIC_KEY>
# PresharedKey (nếu firmware ER605 hỗ trợ): <REPLACE_WITH_OPTIONAL_PSK>
# Chỉ cho phép đúng IP tunnel của ER605 và IP LAN đơn lẻ của camera [VÍ DỤ / EXAMPLE]
AllowedIPs = 10.66.0.2/32, 192.0.2.10/32
PersistentKeepalive = 25
